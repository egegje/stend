<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Правеж Коллекшн - показательный стенд</title>
<noscript><meta http-equiv="refresh" content="2; url=https://lender-shared-ideal-zone.trycloudflare.com"></noscript>
<style>
  body { margin:0; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         background:#f5f7fa; color:#1c2430; display:flex; min-height:100vh;
         align-items:center; justify-content:center; }
  .box { background:#fff; border:1px solid #dde3ea; border-radius:14px; padding:32px;
         max-width:520px; box-shadow:0 8px 30px rgba(20,40,70,.08); }
  h1 { font-size:22px; margin:0 0 12px; }
  p { margin:0 0 14px; }
  a.go { display:inline-block; background:#0b5c8f; color:#fff; text-decoration:none;
         padding:10px 18px; border-radius:9px; }
  .warn { background:#fdf2e3; color:#96570a; border:1px solid #e08a0b;
          border-radius:9px; padding:10px 14px; font-size:14px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Правеж Коллекшн</h1>
    <p class="warn">Показательный стенд: данные учебные. Настоящие данные должников
       вводить нельзя - персональные данные россиян обрабатываются только на площадке
       в России, а стенд стоит временно и не для этого.</p>
    <p>Открываю систему. Если ничего не произошло, нажмите кнопку.</p>
    <p><a class="go" id="go" href="https://lender-shared-ideal-zone.trycloudflare.com">Открыть систему</a></p>
  </div>
  <script>
    // Ссылка .../stend/?p=/путь открывает этот путь стенда. Путь берем, только если он начинается
    // с одной косой черты и состоит из латинских букв, цифр и знаков из набора /_-?=&. (чтобы
    // ссылка не увела на чужой сайт), иначе ведем на вход.
    var put = new URLSearchParams(location.search).get("p") || "";
    var kuda = "https://lender-shared-ideal-zone.trycloudflare.com".replace(/\/$/, "") + (/^\/(?!\/)[A-Za-z0-9\/_\-?=&.]*$/.test(put) ? put : "");
    document.getElementById("go").href = kuda;
    setTimeout(function () { location.replace(kuda); }, 2000);
  </script>
</body>
</html>
